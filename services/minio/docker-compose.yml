version: '3.8'

services:
    minio:
        image: quay.io/minio/minio:latest
        container_name: minio_storage
        restart: unless-stopped
        ports: 
            - "0.0.0.0:9000:9000"
            - "0.0.0.0:9001:9001"
        environment:
            MINIO_ROOT_USER: "debian-server"
            MINIO_ROOT_PASSWORD: "debian-server"
        volumes: 
            - ./data:/data
        command: server /data --console-address ":9001"
