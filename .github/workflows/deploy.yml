name: Build and push docker images

on:
    push:
        branches: 
            - main

env: 
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs: 
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps: 
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: log in to github container registry
              uses: docker/login-action@v3
              with: 
                registry: ${{ env.REGISTRY }}
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }} 

            - name: Extract metadata (tags, labels) for docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

            - name: Build and push docker image
              uses: docker/build-push-action@v5
              with:
                context: . 
                push: true
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}

deploy: 
    needs: build-and-push
    runs-on: ubuntu-latest

    steps: 
        - name: Deploy to debian server via ssh
          uses: appleboy/ssh-action@v1.0.3
          with:
            - host: ${{ secrets.SERVER_HOST }}
              username: ${{ secrets.SERVER_USER }}
              key: ${{ secrets.SSH_PRIVATE_KEY }}
              script: | 
                sudo docker pull ghcr.io/${{ github.repository }}:main
                sudo docker rm -f test-web || true
                sudo docker run -d --name test-web -p 0.0.0.0:8080:80 ghcr.io/${{ github.github.repository }}:main
